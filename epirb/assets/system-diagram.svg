<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" fill="none" aria-label="RALA System Operational Sequence Diagram">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="12" fill="#070F1B"/>
  <rect width="1000" height="420" rx="12" fill="url(#tech-grid)"/>
  <rect width="998" height="418" x="1" y="1" rx="11" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Technical Axis / Datum Line -->
  <line x1="50" y1="210" x2="950" y2="210" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- STEP 1: DEPLOYMENT & STANDBY -->
  <g transform="translate(80, 70)">
    <!-- Vessel / Carrier Line Art -->
    <path d="M 20 100 L 140 100 L 160 70 L 0 70 Z" fill="#112240" stroke="#2A5080" stroke-width="1.5"/>
    <path d="M 40 70 L 40 40 L 100 40 L 100 70" fill="none" stroke="#2A5080" stroke-width="1.5"/>
    <!-- Beacon Unit -->
    <rect x="65" y="20" width="10" height="20" rx="2" fill="#112240" stroke="#C84A00" stroke-width="1.5"/>
    <circle cx="70" cy="15" r="3" fill="#6B7280"/>
    
    <!-- Status Text -->
    <text x="80" y="145" text-anchor="middle" fill="#E2E5EA" font-family="Inter, sans-serif" font-size="13" font-weight="600">1. Departure &amp; Standby</text>
    <text x="80" y="165" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">Beacon deployed in standby</text>
    <text x="80" y="180" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">(Non-Emergency mode)</text>
  </g>

  <!-- Flow Arrow 1-2 -->
  <path d="M 230 170 L 270 170" stroke="#2A5080" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="270,166 278,170 270,174" fill="#2A5080"/>

  <!-- STEP 2: CONCERN RAISED -->
  <g transform="translate(290, 70)">
    <rect x="10" y="20" width="140" height="90" rx="6" fill="#0B1A2E" stroke="#1B3A5C" stroke-width="1.5"/>
    
    <!-- Geofence / Check-in Icon -->
    <circle cx="80" cy="55" r="22" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 80 43 L 80 55 L 90 55" stroke="#C84A00" stroke-width="1.5" fill="none"/>
    <circle cx="80" cy="55" r="3" fill="#C84A00"/>

    <text x="80" y="145" text-anchor="middle" fill="#E2E5EA" font-family="Inter, sans-serif" font-size="13" font-weight="600">2. Concern Raised</text>
    <text x="80" y="165" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">Overdue check-in, geofence,</text>
    <text x="80" y="180" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">or sensor alert</text>
  </g>

  <!-- Flow Arrow 2-3 -->
  <path d="M 440 170 L 480 170" stroke="#2A5080" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="480,166 488,170 480,174" fill="#2A5080"/>

  <!-- STEP 3: AUTHORISED REMOTE ACTIVATION -->
  <g transform="translate(500, 70)">
    <rect x="10" y="20" width="140" height="90" rx="6" fill="#0B1A2E" stroke="#C84A00" stroke-width="1.5"/>
    
    <!-- Command Signal Rays -->
    <path d="M 45 45 C 60 30, 100 30, 115 45" stroke="#C84A00" stroke-width="1.5" fill="none"/>
    <path d="M 55 55 C 65 45, 95 45, 105 55" stroke="#C84A00" stroke-width="1.5" fill="none"/>
    <circle cx="80" cy="70" r="5" fill="#C84A00"/>

    <text x="80" y="145" text-anchor="middle" fill="#E2E5EA" font-family="Inter, sans-serif" font-size="13" font-weight="600">3. Remote Activation</text>
    <text x="80" y="165" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">Authorised signal sent</text>
    <text x="80" y="180" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">to activate beacon</text>
  </g>

  <!-- Flow Arrow 3-4 -->
  <path d="M 650 170 L 690 170" stroke="#2A5080" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="690,166 698,170 690,174" fill="#2A5080"/>

  <!-- STEP 4: EMERGENCY TRANSMISSION & SAR RESPONSE -->
  <g transform="translate(710, 70)">
    <rect x="10" y="20" width="150" height="90" rx="6" fill="#112240" stroke="#1B3A5C" stroke-width="1.5"/>
    
    <!-- Pin & Location Confirmation -->
    <path d="M 85 40 C 73 40, 65 48, 65 60 C 65 75, 85 90, 85 90 C 85 90, 105 75, 105 60 C 105 48, 97 40, 85 40 Z" fill="#C84A00" opacity="0.2"/>
    <path d="M 85 40 C 73 40, 65 48, 65 60 C 65 75, 85 90, 85 90 C 85 90, 105 75, 105 60 C 105 48, 97 40, 85 40 Z" stroke="#C84A00" stroke-width="1.5" fill="none"/>
    <circle cx="85" cy="58" r="4" fill="#E2E5EA"/>

    <text x="85" y="145" text-anchor="middle" fill="#E2E5EA" font-family="Inter, sans-serif" font-size="13" font-weight="600">4. Emergency &amp; SAR Response</text>
    <text x="85" y="165" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">Beacon confirms location and</text>
    <text x="85" y="180" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">transmits distress information.</text>
  </g>

  <!-- Technical Schematic Annotations -->
  <g transform="translate(50, 290)">
    <rect width="900" height="90" rx="6" fill="rgba(11, 26, 46, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <g transform="translate(30, 30)">
      <line x1="0" y1="15" x2="30" y2="15" stroke="#2A5080" stroke-width="1.5"/>
      <text x="40" y="19" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">Standby Operation (Non-Emergency)</text>
    </g>

    <g transform="translate(320, 30)">
      <line x1="0" y1="15" x2="30" y2="15" stroke="#C84A00" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="40" y="19" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">Authorised Remote Command Pathway</text>
    </g>

    <g transform="translate(640, 30)">
      <circle cx="10" cy="15" r="5" fill="#C84A00"/>
      <text x="25" y="19" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">Location &amp; Distress Confirmation</text>
    </g>

    <text x="450" y="70" text-anchor="middle" fill="#6B7280" font-family="Inter, sans-serif" font-size="11">
      Conceptual signal sequence as described in patent specifications. Specific communication infrastructure subject to partner implementation.
    </text>
  </g>
</svg>
